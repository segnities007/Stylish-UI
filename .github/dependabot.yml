# Automated dependency updates.
#
# PRs created here use Conventional Commits prefixes so they pass the
# pr-title-check workflow (chore(deps) for libraries, ci for GitHub Actions)
# and are grouped to keep the number of open PRs low for a solo maintainer.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

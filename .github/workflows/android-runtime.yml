name: Android Runtime Smoke

# Heavy emulator job: run manually when runtime evidence is needed instead of
# on every push. The same script also works against a local emulator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-runtime:
    name: Android API 35 runtime smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Run Android emulator accessibility smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          # Cold-boot without snapshots: snapshot restore/save can hang on
          # hosted runners and the API 35 image can exceed the default boot
          # window, so give it an explicit longer timeout.
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: bash scripts/verify-android-runtime.sh
      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-runtime-evidence
          path: build/reports/android-runtime/
          if-no-files-found: ignore

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-branch-base:
    name: Check branch base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only meaningful for pull requests: verifies the branch does not
    # re-introduce commits whose content is already in main (a symptom of
    # branching from a squash-merged branch, which causes spurious
    # conflicts — see AGENTS.md rule 3).
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify no already-merged commits in the branch
        run: |
          set -euo pipefail
          # git cherry marks '-' commits whose content is already in main
          # (patch-id match). A '-' entry means this branch was based on a
          # squash-merged branch and re-applies already-merged work.
          stale=$(git cherry origin/main HEAD | grep '^-' || true)
          if [ -n "$stale" ]; then
            echo "::error::This branch contains commits that are already in main (squash-merged)."
            echo "::error::Create a fresh branch from origin/main (scripts/new-branch.sh) and re-apply the new work only."
            git cherry -v origin/main HEAD | grep '^-' || true
            exit 1
          fi
          echo "branch base is clean (no already-merged commits)"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: 'on-failure'

      - name: Build and test
        run: ./gradlew check

      - name: Check public ABI
        run: ./gradlew apiCheck

      - name: Upload build reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore

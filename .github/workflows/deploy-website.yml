name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site (gallery + API docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          add-job-summary: 'on-failure'

      # Clean before building: the webpack bundle keeps stale hashed
      # artifacts, which previously produced an index.js referencing a wasm
      # that was never uploaded (site broken with a 404 wasm).
      - name: Build Wasm gallery
        run: ./gradlew :website-wasm:clean :website-wasm:wasmJsBrowserProductionWebpack

      - name: Build Dokka API docs
        run: ./gradlew dokkaGeneratePublicationHtml

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/api
          # CMP 1.11 writes the production bundle to build/kotlin-webpack;
          # older layouts used build/dist. Copy from whichever exists so the
          # hashed wasm files always ship together with the bundle.
          for dir in \
            website-wasm/build/dist/wasmJs/productionExecutable \
            website-wasm/build/kotlin-webpack/wasmJs/productionExecutable; do
            if [ -d "$dir" ]; then
              cp -r "$dir"/* _site/
            fi
          done
          cp -r build/dokka/html/* _site/api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: PR title check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            core
            components
            theme
            tokens
            foundation
            main
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$  # Subject must not start with uppercase
          subjectPatternError: |
            The subject must not start with an uppercase character.
          wip: false

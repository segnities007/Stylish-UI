name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Permissions are restricted to the minimum required for publishing.
permissions:
  contents: write

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Pin the publish version to the release tag.
      #
      # The git tag is the single source of truth for a release version.
      # build.gradle.kts reads its version from version.properties, so we sync
      # version.properties to the tag before any Gradle task runs. This makes
      # the published version correct by construction, even if version.properties
      # has drifted from the released version. A mismatch is reported as a
      # warning because it signals that Release Please did not keep
      # version.properties (its extra-file) in sync with the manifest.
      #
      # On workflow_dispatch (no tag) version.properties is used as-is.
      # ----------------------------------------------------------------------
      - name: Pin publish version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not a valid semver version"
            exit 1
          fi
          FILE_VERSION="$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "::warning::version.properties ($FILE_VERSION) drifted from release tag ($VERSION); pinning to the tag. Release Please should keep these in sync."
          fi
          sed -i "s/^version=.*/version=$VERSION/" version.properties
          echo "Publishing version $VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          add-job-summary: 'always'

      # ----------------------------------------------------------------------
      # Validate secrets before attempting a potentially long build.
      # ----------------------------------------------------------------------
      - name: Verify signing secrets
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./scripts/verify-signing.sh

      # ----------------------------------------------------------------------
      # Build and test the library first so that publishing fails fast on errors.
      # ----------------------------------------------------------------------
      - name: Build and verify release artifacts
        run: ./gradlew check

      # ----------------------------------------------------------------------
      # Publish and release to Maven Central.
      # Note: configuration cache is disabled for release publishing because
      # the vanniktech maven-publish plugin does not yet support it for this task.
      # ----------------------------------------------------------------------
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Trim accidental whitespace/newlines from key ID.
          # GitHub Secrets sometimes preserves trailing newlines when pasting.
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId=$(echo -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" | tr -d '[:space:]')
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon

      # ----------------------------------------------------------------------
      # Upload artifacts for debugging / record keeping.
      # ----------------------------------------------------------------------
      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-publication-artifacts
          path: '**/build/libs/'
          if-no-files-found: ignore

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore

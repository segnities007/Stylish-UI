name: Release and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)publish manually, e.g. v0.5.1'
        required: false

# Permissions are restricted to the minimum required.
permissions:
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # Create/update the release PR, and cut the tag + GitHub Release when a
  # release PR is merged. Runs only on pushes to main.
  # --------------------------------------------------------------------------
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --------------------------------------------------------------------------
  # Publish to Maven Central. Runs when release-please cut a release
  # (release_created == true), or on manual workflow_dispatch.
  #
  # This lives in the SAME workflow as release-please so that publishing is
  # triggered by the push-to-main event (the release PR merge), not by the tag
  # push. Tags created with the default GITHUB_TOKEN do not trigger other
  # workflows, which is why a separate tag-triggered publish workflow never
  # fired. Keeping both jobs in one workflow sidesteps that limitation without
  # needing a personal access token.
  # --------------------------------------------------------------------------
  publish:
    needs: release-please
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || needs.release-please.outputs.tag_name || github.ref }}

      # ----------------------------------------------------------------------
      # Pin the publish version to the release tag.
      #
      # The git tag is the single source of truth for the release version.
      # build.gradle.kts reads its version from version.properties, so we sync
      # version.properties to the resolved tag before any Gradle task runs.
      # This makes the published version correct by construction, even if
      # version.properties has drifted from the released version. A mismatch is
      # reported as a warning because it signals that Release Please did not
      # keep version.properties (its extra-file) in sync with the manifest.
      # ----------------------------------------------------------------------
      - name: Pin publish version to release tag
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || needs.release-please.outputs.tag_name || github.ref }}"
          VERSION="${REF#refs/tags/}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve a valid semver version from '$REF'. For manual runs, pass the tag input (e.g. v0.5.1)."
            exit 1
          fi
          FILE_VERSION="$(grep '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [[ "$FILE_VERSION" != "$VERSION" ]]; then
            echo "::warning::version.properties ($FILE_VERSION) drifted from release version ($VERSION); pinning to the release. Release Please should keep these in sync."
          fi
          sed -i "s/^version=.*/version=$VERSION/" version.properties
          echo "Publishing version $VERSION"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          add-job-summary: 'always'

      # ----------------------------------------------------------------------
      # Validate secrets before attempting a potentially long build.
      # ----------------------------------------------------------------------
      - name: Verify signing secrets
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./scripts/verify-signing.sh

      # ----------------------------------------------------------------------
      # Build and test the library first so that publishing fails fast on errors.
      # ----------------------------------------------------------------------
      - name: Build and verify release artifacts
        run: ./gradlew check

      # ----------------------------------------------------------------------
      # Publish and release to Maven Central.
      # Note: configuration cache is disabled for release publishing because
      # the vanniktech maven-publish plugin does not yet support it for this task.
      # ----------------------------------------------------------------------
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Trim accidental whitespace/newlines from key ID.
          # GitHub Secrets sometimes preserves trailing newlines when pasting.
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId=$(echo -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" | tr -d '[:space:]')
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon

      # ----------------------------------------------------------------------
      # Upload artifacts for debugging / record keeping.
      # ----------------------------------------------------------------------
      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-publication-artifacts
          path: '**/build/libs/'
          if-no-files-found: ignore

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
